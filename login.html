<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPITALE TT — Connexion</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body.login-page {
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      background:
        linear-gradient(
          135deg,
          #0b1f3a 0%,
          #12345b 52%,
          #2f80ed 100%
        );
    }

    .login-wrapper {
      width:min(430px, 100%);
    }

    .login-brand {
      text-align:center;
      color:#fff;
      margin-bottom:22px;
    }

    .login-logo {
      width:64px;
      height:64px;
      margin:0 auto 14px;
      border-radius:16px;
      display:grid;
      place-items:center;
      background:#5ca8ff;
      color:#fff;
      font-size:21px;
      font-weight:900;
      box-shadow:0 14px 35px rgba(0,0,0,.2);
    }

    .login-brand h1 {
      margin:0 0 6px;
      font-size:25px;
    }

    .login-brand p {
      margin:0;
      color:#cfe4ff;
      font-size:13px;
    }

    .login-card {
      background:#fff;
      border-radius:16px;
      padding:28px;
      box-shadow:0 20px 60px rgba(0,0,0,.25);
      animation:loginRise .35s ease both;
    }

    .login-card h2 {
      margin:0 0 6px;
      color:var(--navy);
      font-size:21px;
    }

    .login-card > p {
      margin:0 0 22px;
      color:var(--muted);
      font-size:13px;
    }

    .login-form {
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .login-field label {
      display:block;
      margin-bottom:6px;
      color:#5d728c;
      font-size:11px;
      font-weight:750;
    }

    .login-field input {
      width:100%;
      padding:12px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fbfdff;
      color:var(--ink);
      outline:none;
    }

    .login-field input:focus {
      border-color:#8ec4ff;
      box-shadow:0 0 0 3px #eaf4ff;
    }

    .password-wrapper {
      position:relative;
    }

    .password-wrapper input {
      padding-right:74px;
    }

    .password-toggle {
      position:absolute;
      top:50%;
      right:8px;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      color:var(--blue);
      font-size:11px;
      font-weight:700;
    }

    .login-button {
      width:100%;
      margin-top:5px;
    }

    .login-message {
      display:none;
      margin-top:15px;
      padding:11px 12px;
      border-radius:8px;
      font-size:12px;
      line-height:1.45;
    }

    .login-message.error {
      display:block;
      color:#a32e3c;
      background:#fff2f3;
      border:1px solid #ffd6da;
    }

    .login-message.success {
      display:block;
      color:#11784d;
      background:#eaf8f1;
      border:1px solid #c9eedc;
    }

    .login-footer {
      margin-top:18px;
      text-align:center;
      color:var(--muted);
      font-size:11px;
    }

    @keyframes loginRise {
      from {
        opacity:0;
        transform:translateY(12px);
      }

      to {
        opacity:1;
        transform:none;
      }
    }
  </style>
</head>

<body class="login-page">

  <main class="login-wrapper">
    <div class="login-brand">
      <div class="login-logo">CT</div>
      <h1>CAPITALE TT</h1>
      <p>Gestion BTP intelligente</p>
    </div>

    <section class="login-card">
      <h2>Bienvenue</h2>
      <p>Connectez-vous pour accéder à votre espace.</p>

      <form id="loginForm" class="login-form">
        <div class="login-field">
          <label for="email">Adresse e-mail</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="exemple@entreprise.fr"
            required
          >
        </div>

        <div class="login-field">
          <label for="password">Mot de passe</label>

          <div class="password-wrapper">
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="Votre mot de passe"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
            >
              Afficher
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="btn primary login-button"
          id="loginButton"
        >
          Se connecter
        </button>
      </form>

      <div id="loginMessage" class="login-message"></div>

      <div class="login-footer">
        CAPITALE TT — Espace sécurisé
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    'use strict';

    const SUPABASE_URL =
      'https://fgbononhkgwdsgatjloa.supabase.co';

    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnYm5vbm5oa2d3ZHNnYXRqbG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNjk5OTMsImV4cCI6MjEwNTc0NTk5M30.GjhCHXjOO0BIpOxUWSGKx2mV1JKHRSyJWijg25Ix8Dk';

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    const loginForm =
      document.getElementById('loginForm');

    const loginButton =
      document.getElementById('loginButton');

    const loginMessage =
      document.getElementById('loginMessage');

    const passwordInput =
      document.getElementById('password');

    const passwordToggle =
      document.getElementById('passwordToggle');

    function showMessage(message, type) {
      loginMessage.textContent = message;
      loginMessage.className =
        'login-message ' + type;
    }

    passwordToggle.addEventListener('click', () => {
      const isPassword =
        passwordInput.type === 'password';

      passwordInput.type =
        isPassword ? 'text' : 'password';

      passwordToggle.textContent =
        isPassword ? 'Masquer' : 'Afficher';
    });

    loginForm.addEventListener(
      'submit',
      async (event) => {
        event.preventDefault();

        const email =
          document.getElementById('email')
            .value
            .trim();

        const password =
          passwordInput.value;

        loginButton.disabled = true;
        loginButton.textContent =
          'Connexion...';

        loginMessage.className =
          'login-message hidden';

        const { error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          showMessage(
            'Connexion impossible : ' +
            error.message,
            'error'
          );

          loginButton.disabled = false;
          loginButton.textContent =
            'Se connecter';

          return;
        }

        showMessage(
          'Connexion réussie. Ouverture de votre espace...',
          'success'
        );

        setTimeout(() => {
          window.location.replace('index.html');
        }, 500);
      }
    );

    supabaseClient.auth.getSession()
      .then(({ data }) => {
        if (data.session) {
          window.location.replace('index.html');
        }
      });
  </script>
</body>
</html>
