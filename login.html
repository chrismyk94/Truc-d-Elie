<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — CAPITALE TT</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏗️</text></svg>">
    <!-- Chargement de la police Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- STYLES CSS LOGIN -->
    <style>
        :root {
            --primary-brand: #1d4ed8;   
            --primary-hover: #1e40af;   
            --primary-light: #3b82f6;   
            --accent-glow: rgba(59, 130, 246, 0.15);
            
            --bg-main: #f1f5f9;         
            --bg-card: #ffffff;         
            --text-main: #0f172a;       
            --text-muted: #64748b;      
            --border-color: #e2e8f0;    
            --red: #dc2626;
            --red-bg: #fef2f2;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --radius-sm: 8px;
            --radius-lg: 20px;
            
            --shadow-card: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .login-header { text-align: center; margin-bottom: 32px; }

        .logo-large {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary-brand));
            color: #fff; font-weight: 900; font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 16px; margin: 0 auto 16px auto;
            box-shadow: 0 8px 20px rgba(29, 78, 216, 0.35);
        }

        .login-header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
        .login-header p { font-size: 13.5px; color: var(--text-muted); margin-top: 6px; }

        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .form-group label { font-size: 13px; font-weight: 600; }
        .form-group input {
            padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);
            font-size: 14px; outline: none; background-color: var(--bg-main); transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: var(--primary-light); background-color: #ffffff; box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .form-options { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 24px; }
        .form-options label { color: var(--text-muted); cursor: pointer; }
        .form-options a { color: var(--primary-brand); text-decoration: none; font-weight: 600; }
        
        .btn-submit {
            width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary-brand), var(--primary-hover));
            color: #ffffff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3);
        }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(29, 78, 216, 0.4); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        .toast-error {
            background-color: var(--red-bg); color: var(--red); border: 1px solid #fecaca;
            padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 20px;
            display: none; align-items: center; gap: 8px;
        }

        .login-footer { text-align: center; margin-top: 24px; font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <div class="logo-large">CT</div>
            <h1>CAPITALE TT</h1>
            <p>Connectez-vous à votre espace gérant BTP</p>
        </div>

        <div id="errorBox" class="toast-error">
            ⚠️ <span id="errorMessage">Identifiants incorrects.</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" placeholder="nom@capitalett.fr" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <div class="form-options">
                <label><input type="checkbox"> Se souvenir de moi</label>
                <a href="#">Mot de passe oublié ?</a>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Se connecter</button>
        </form>

        <div class="login-footer">Version 5.0 — Sécurisé par Supabase</div>
    </div>

    <!-- Import Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Initialisation avec tes clés
        const SUPABASE_URL = 'https://horamhbkctywmrwdkkbh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvcmFtaGJrY3R5d21yd2Rra2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2OTc1ODEsImV4cCI6MjEwOTI3MzU4MX0.WWySb_d91xntBywWGozWUabCUerScplGiLtHOyFXhAo';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Vérifie si on est déjà connecté (redirige direct)
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'index.html';
            }
        }
        checkSession();

        // Gérer la soumission du formulaire
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            const errorMsg = document.getElementById('errorMessage');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerText = 'Connexion en cours...';
            errorBox.style.display = 'none';

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorBox.style.display = 'flex';
                errorMsg.innerText = error.message;
                btn.disabled = false;
                btn.innerText = 'Se connecter';
            } else {
                // Redirection vers le dashboard si succès
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
